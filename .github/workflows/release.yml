name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.1.0）"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v', 'V')

          $title = ""
          if (Test-Path ".github/release-title.txt") {
            $title = (Get-Content ".github/release-title.txt" -Raw).Trim()
          }
          if (-not $title) { $title = "Mutsumi Launcher $version" }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT

      - name: Remove previous release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release delete "${{ steps.version.outputs.tag }}" --yes 2>$null; exit 0

      - name: Publish
        run: >
          dotnet publish src/MutsumiLauncher/MutsumiLauncher.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:DebugType=None -o dist/publish

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DAPP_VERSION=${{ steps.version.outputs.version }}" installer/MutsumiLauncher.nsi
          $source = Get-ChildItem dist -Filter "MutsumiLauncher-*-setup.exe" | Select-Object -First 1
          if (-not $source) { throw "NSIS 没有产出安装包" }
          $target = "dist/MutsumiLauncher-${{ steps.version.outputs.version }}-Setup.exe"
          Move-Item $source.FullName $target -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title }}
          body_path: .github/release-notes.md
          files: dist/MutsumiLauncher-${{ steps.version.outputs.version }}-Setup.exe

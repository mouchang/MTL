name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.1.0）"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v', 'V')

          # 标题自动生成；正式版不带 build 后缀，预发布才带
          if ($tag -match "-") { $title = "MTL Beta v$version" }
          else { $title = "MTL Release v$version" }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

          # 带预发布标记的 tag（v1.2.0-beta.1）用 beta 通道，快捷方式会带后缀
          $channel = if ($tag -match "-") { "beta" } else { "" }
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT

      - name: Remove previous release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release delete "${{ steps.version.outputs.tag }}" --yes 2>$null; exit 0

      - name: Publish
        run: >
          dotnet publish src/MutsumiLauncher/MutsumiLauncher.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:DebugType=None -o dist/publish

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DAPP_VERSION=${{ steps.version.outputs.version }}" "/DAPP_CHANNEL=${{ steps.version.outputs.channel }}" installer/MutsumiLauncher.nsi
          $source = Get-ChildItem dist -Filter "MutsumiLauncher-*-setup.exe" | Select-Object -First 1
          if (-not $source) { throw "NSIS 没有产出安装包" }
          $target = "dist/MutsumiLauncher-${{ steps.version.outputs.version }}-Setup.exe"
          Move-Item $source.FullName $target -Force

      - name: Build portable zip
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $target = "dist/MutsumiLauncher-${{ steps.version.outputs.version }}-portable.zip"
          [IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path "dist/publish").Path,
            (Join-Path (Get-Location) $target),
            [IO.Compression.CompressionLevel]::Optimal, $false)
          if (-not (Test-Path $target)) { throw "没有产出便携包" }

      - name: Extract release notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $start = -1

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match ("^## \[" + [regex]::Escape($version) + "\]")) { $start = $i; break }
          }

          if ($start -lt 0) {
            # 没有对应段落就退回最近一次未发布的内容
            $body = "本版本的详细改动见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。"
          }
          else {
            $end = $lines.Count
            for ($i = $start + 1; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "^## \[") { $end = $i; break }
            }

            $body = ($lines[($start)..($end - 1)] -join "`n").Trim()

            # 去掉开头的版本标题行，页面标题已经写了版本
            $body = ($body -split "`n" | Select-Object -Skip 1) -join "`n"

            # 公告只保留「更新内容」部分；「技术实现」属于 CHANGELOG，不往发布页贴
            $cut = $body.IndexOf("### 技术实现")
            if ($cut -lt 0) { $cut = $body.IndexOf("### 技术细节") }
            if ($cut -lt 0) { $cut = $body.IndexOf("### 技术") }
            if ($cut -ge 0) { $body = $body.Substring(0, $cut) }

            $body = $body.Trim()
          }

          # 发布页始终补一行 CHANGELOG 指引：技术实现不贴上去，但不能让人看不到
          $body = $body + "`n`n完整更新说明（含技术实现）详情见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。"

          Set-Content -Path ".github/release-notes.generated.md" -Value $body -Encoding UTF8
          Write-Host $body

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title }}
          body_path: .github/release-notes.generated.md
          files: |
            dist/MutsumiLauncher-${{ steps.version.outputs.version }}-Setup.exe
            dist/MutsumiLauncher-${{ steps.version.outputs.version }}-portable.zip
name: 功能建议
description: 想要的新功能、交互改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么问题
      description: 描述使用场景，而不是直接指定实现方式
      placeholder: 每次安装整合包都要手动……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      placeholder: 希望可以……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 参考
      description: 例如 PCL2、HMCL 的做法，或相关链接
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、草图、录屏都可以
    validations:
      required: false

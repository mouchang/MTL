name = "mtl-sub"
main = "sub-gateway.js"
compatibility_date = "2026-10-01"

# 独立路由：比 mtl.dpdns.org/* 更具体，不会影响 NeoForge / Modrinth 那两个 Worker
routes = [
  { pattern = "mtl.dpdns.org/sub/*", zone_name = "mtl.dpdns.org" }
]

[vars]
SUB_ENABLED = "1"

# 可选：建一个 KV 用来做开关和白名单（不绑也能用，默认开放模式）
#   npx wrangler kv namespace create SUB_KV
# 然后把返回的 id 填到下面，去掉注释：
#
# [[kv_namespaces]]
# binding = "SUB_KV"
# id = "<粘贴 namespace id>"

# SUB_URL 不要写在这里，用：
#   npx wrangler secret put SUB_URL
